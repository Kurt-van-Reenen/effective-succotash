server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # __ASSET_ORIGIN__ is replaced at Docker build time with the VITE_ASSET_BASE_URL origin, or removed when assets are self-hosted.
    # Inline styles are required by Recharts' responsive SVG layout and validated API-driven chart/progress styling; scripts remain self-hosted only.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'__ASSET_ORIGIN__; style-src 'self'__ASSET_ORIGIN__ 'unsafe-inline'; img-src 'self'__ASSET_ORIGIN__ data:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = /index.html {
        expires -1;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
